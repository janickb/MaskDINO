# Phase-1 classifier: 8 set-A classes, masks from the frozen single-class MaskDINO.
# See spec_cropcls.md. The detector side is inherited by merging the run's own config.yaml.

detector_checkpoint: /home/janick.bilang/dev/MaskDINO/runs/20261007130733_single_class_v2/model_final.pth
detector_score_thresh: 0.5

# the class count is derived from train_dataset's thing_classes, never stated
train_dataset: train_seta_mm
val_dataset: val_seta_mm

# Static crop folder written by tools/extract_crops.py. Set = train from disk, no detector
# forward during training; empty = the live pipeline. The mask settings baked in at extraction
# (margin, iou_floor, runner_up_ceiling, detector) are recorded in <crop_folder>/meta.json.
#   PYTHONPATH=. python tools/extract_crops.py --config <this> --out crops/train
crop_folder: crops/train

augment_frames: false   # detector sees clean frames; augmentation is crop-level

crop_size: 448
rotations: [0, 90, 180, 270]

iou_floor: 0.5
runner_up_ceiling: 0.2

# Keep every Nth val frame, applied once to the dataset registration so it reaches the
# in-training monitor, --eval-only and --hungarian alike. 4 matches the 8-class baseline's
# protocol, so classaware_f1 is scored over the same frames. 1 = score every frame.
val_stride: 4
# Drop frame-border-truncated GT before scoring. The 8-class baseline was measured this way:
# its protocol is "stride 4, excl-truncated, 1201 GT", and stride 4 + this filter reproduces
# 1201 exactly on val_seta_mm (4802 -> 4693 untruncated -> 1201 at stride 4). Leaving it off
# scores 26 extra clipped instruments the baseline never had to classify.
exclude_truncated: true

# the classifier's trunk (any timm backbone). MaskDINO stays frozen regardless.
trunk: convnext_tiny
trunk_pretrained: true
freeze_trunk: false

# classifier checkpoint to init/resume from, and the one --eval-only scores. Empty means
# "start from the trunk's pretrained weights"; --eval-only then falls back to
# <output_dir>/model_final.pth.
weights: ""

base_lr: 0.0001
weight_decay: 0.05

max_iter: 4000
ims_per_batch: 4          # FRAMES per detector forward - validation and the live path only
crops_per_batch: 64       # CROPS per step when crop_folder is set. The two units differ.
warmup_iters: 250
# Coarse enough for the quota (~95 MB each), fine enough to pick the checkpoint from BEFORE
# val loss turns - model_final.pth may not be the best one.
checkpoint_period: 1000
eval_period: 500          # 8 points, enough to see the 1500-2500 turn rather than infer it
amp: true

output_dir: runs/cxt_c448_dil0
