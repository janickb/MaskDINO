# Set C (23 scissor-wear / screwdriver types): convnext_tiny c448 recipe of
# runs/20261105154745_cxt_c448_newds_s0, with the set-C single-class segmenter as mask source.
# Train crops are 1 instrument/frame (460 frames, 20/class); val is dense (256 frames, 1165 GT).
detector_checkpoint: /home/janick.bilang/dev/MaskDINO/runs/20261108204507_p2_setc_cp/model_final.pth
detector_score_thresh: 0.5

train_dataset: train_phase2_set_c_mm-1.0x
val_dataset: val_set_c_mm-1.0x

crop_folder: crops/setc_train_pad20

augment_frames: false

crop_size: 448
rotations: [0, 90, 180, 270]

mask_channel: true
blackout: false
mask_dilate: 0

pad_frac: 0.0

iou_floor: 0.5
runner_up_ceiling: 0.2

# full val set: ~50 GT per class, a quarter would leave ~12
val_stride: 1
exclude_truncated: true

trunk: convnext_tiny
trunk_pretrained: true
freeze_trunk: false

weights: ""

base_lr: 0.0001
weight_decay: 0.05

max_iter: 4000
ims_per_batch: 4
crops_per_batch: 64
warmup_iters: 250
checkpoint_period: 99999
eval_period: 1000
amp: true

output_dir: runs/setc_cxt_c448
