_BASE_: ../maskdino_R50_surgical_tools_reclassify_unfreeze_encoder_decoder.yaml
# --- Phase-2 augmentation wave, arm: CALIBRATED_JITTER -----------------------
# The OFF-CENTRE per-instance jitter that won appearance_aug_sweep_phase2.md
# (abl_jitteronly, +5.3 sigma, forcep03 33% -> 82% of detected correct), on top of
# this wave's no-op CONTROL instead of the old control's 0.7-1.3 frame dose - so
# this arm differs from CONTROL in INSTANCE_JITTER alone.
#
# Per pasted instance: brightness/contrast centres 0.80/1.70, calibrated to land
# synthetic tool-pixel mean/std on the real-photo target (130.6 / 53.7);
# saturation, hue and per-instance defocus exactly as abl_jitteronly. Contrast
# with OBJECT_JITTER_ONLY, which is the same axis at equal-ish width but centred
# on 1.0 (the abl_jitter_symmetric condition, +1.9 sigma last wave).
#
# Shared protocol (held identical across every arm in this wave): base config
# above (encoder+decoder+head trainable, backbone frozen), DATASETS.TRAIN
# reclass_setab_mm -> DATASETS.TEST val_setab_mm, COPY_PASTE.ENABLED True with
# CLUSTER_PROB 1.0 and PERSPECTIVE.PROB 0.0. Scale / batch / iters / LR come from
# that base config (no arm file sets them, so arms can only differ in their dose);
# seed is set by tools/augmentation/run_aug_sweep.sh.

INPUT:
  COPY_PASTE:
    INSTANCE_JITTER:
      BRIGHTNESS:  [0.72, 0.88]   # centre 0.80, calibrated to real tool pixels
      CONTRAST:    [1.50, 1.90]   # centre 1.70
      SATURATION:  [0.9, 1.3]
      HUE_DEGREES: 4.0
      BLUR_SIGMA:  [0.0, 0.5]
  PHOTOMETRIC:
    BRIGHTNESS: [1.0, 1.0]
    CONTRAST:   [1.0, 1.0]
    SATURATION: [1.0, 1.0]
    NOISE_PROB: 0.0
    NOISE_STD:  [0.0, 0.0]
OUTPUT_DIR: "runs/augexp_calibrated_jitter_larger_forcep_fixsurf_ident_on_forcep"
