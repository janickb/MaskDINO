_BASE_: ../maskdino_R50_surgical_tools_reclassify_unfreeze_encoder_decoder.yaml
# --- Phase-2 augmentation wave, arm: REALISTIC (MEASURED) -- DO NOT RUN YET ---
# Parked per augmentation_experiments.md ("TBD, DO NOT DO NOW"). Values below are
# the placeholders from that file: per-instance jitter as in OBJECT_JITTER_ONLY
# plus MEDIUM's frame-level dose. They are NOT yet the measured ones - a
# "realistic" arm needs the calibrated off-centre centres (0.80 brightness /
# 1.70 contrast, i.e. [0.72, 0.88] / [1.50, 1.90]) solved against real tool-pixel
# statistics; see the realism arm's header one directory up. Combining jitter with
# the frame bundle was also already measured as null on top of jitter alone
# (aug_realism 0.9018 vs abl_jitteronly 0.9030).#
# Shared protocol (held identical across every arm in this wave): base config
# above (encoder+decoder+head trainable, backbone frozen), DATASETS.TRAIN
# reclass_setab_mm -> DATASETS.TEST val_setab_mm, COPY_PASTE.ENABLED True with
# CLUSTER_PROB 1.0 and PERSPECTIVE.PROB 0.0. Scale / batch / iters / seed are set
# on the command line at launch, NOT here, so no arm file can drift on anything
# but its own dose. Previous wave used MAX_ITER 10000, IMS_PER_BATCH 3 (3 GPUs x
# 1 img), BASE_LR 1e-5, MIN_SCALE/MAX_SCALE 1.0/1.0, TEST_SAMPLE_STRIDE 4; match
# that or this wave is not comparable to appearance_aug_sweep_phase2.md.

INPUT:
  COPY_PASTE:
    INSTANCE_JITTER:
      BRIGHTNESS:  [0.85, 1.15]
      CONTRAST:    [0.85, 1.15]
      SATURATION:  [0.85, 1.15]
      HUE_DEGREES: 4.0
  PHOTOMETRIC:
    BRIGHTNESS: [0.75, 1.25]
    CONTRAST:   [0.75, 1.25]
    SATURATION: [0.75, 1.25]
    NOISE_PROB: 0.25
    NOISE_STD:  [0.0, 1.0]
OUTPUT_DIR: "runs/augexp_realistic_measured"
