_BASE_: ../../Base-Surgical-Phase1.yaml
# Sweep 2, scale axis only: 0.25-3.0, one step wider than the sweep 1 winner
# Sweep 1 showed scale monotonic and unsaturated (0.8-1.2 -> 0.5-2.0 -> 0.3-2.5 gave
# classaware_f1 0.7489 -> 0.7849 -> 0.8119) while the photometric dose moved nothing
# (-0.0011 marginal), so every arm here keeps the default PHOTOMETRIC and varies scale only.
# MAX_ITER 6000: in sweep 1 every arm's best eval fell at iter 1999-7999 and both 0.3-2.5
# arms peaked at 3999, so 20000 iters cost generalization rather than adding it.
# NOTE: the pool hit its 1024 cap at ~09:08 and now FIFO-refreshes, so these arms train on a
# different data regime than sweep 1. aug2_ctl_030_250 repeats sweep 1's winning setting as
# the in-sweep control - compare within this sweep, never across sweeps.
DATASETS:
  TRAIN: ("train_phase1_pool_set_a_mm_singleclass",)
  TEST: ("val_set_ab_mm_singleclass",)
OUTPUT_DIR: "runs/aug2_s025_300"
INPUT:
  MIN_SCALE: 0.25
  MAX_SCALE: 3.0
