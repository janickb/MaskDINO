_BASE_: Base-COCO-InstanceSegmentation.yaml
# Mask2Former's published COCO instance-segmentation config
# (facebookresearch/Mask2Former @ 9b0651c,
#  configs/coco/instance-segmentation/maskformer2_R50_bs16_50ep.yaml), verbatim except
# the TEST.VAL_LOSS block - this fork's shared knob, mirrored from
# maskdino_R50_bs16_50ep_3s.yaml so both architecture bases log "validation_loss" the
# same way.
#
# It inherits the SAME Base-COCO-InstanceSegmentation.yaml as the MaskDINO base: that
# file differs from upstream Mask2Former's copy by one commented-out line, so sharing
# it means SOLVER / INPUT / DATALOADER / backbone defaults are literally the same file
# for both arms rather than two copies that can drift.
MODEL:
  META_ARCHITECTURE: "MaskFormer"
  SEM_SEG_HEAD:
    NAME: "MaskFormerHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 80
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    # pixel decoder. Its deformable-encoder FFN width is hardcoded to 1024 in
    # mask2former/modeling/pixel_decoder/msdeformattn.py, which matches the MaskDINO
    # base's SEM_SEG_HEAD.DIM_FEEDFORWARD: 1024 - the two encoders are the same width.
    PIXEL_DECODER_NAME: "MSDeformAttnPixelDecoder"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
  MASK_FORMER:
    TRANSFORMER_DECODER_NAME: "MultiScaleMaskedTransformerDecoder"
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 100
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    ENC_LAYERS: 0
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    # 10 == 9 real decoder layers + 1 for the loss on the learnable query: the decoder
    # builds DEC_LAYERS - 1 layers. The MaskDINO base writes DEC_LAYERS: 9 for those
    # same 9 layers (it counts the initial prediction separately), so the two numbers
    # are NOT directly comparable - do not "align" them.
    DEC_LAYERS: 10
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: False
      # Panoptic-only knobs - instance_inference reads neither. Pinned to the MaskDINO
      # base's values so a side-by-side config diff of the two arms has nothing
      # misleading in it.
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.25
      # See maskdino/solver/val_loss.py. NOTE: the per-component values are NOT
      # comparable with the MaskDINO arm's - different loss terms (softmax CE vs
      # sigmoid focal, no box/giou/denoising terms here) and different weights. Useful
      # within this arm for plateau LR and early stopping, meaningless across arms.
      VAL_LOSS:
        ENABLED: True
SOLVER:
  AMP:
    ENABLED: True
TEST:
  EVAL_PERIOD: 5000
