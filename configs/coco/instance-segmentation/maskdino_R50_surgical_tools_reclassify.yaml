_BASE_: maskdino_R50_bs16_50ep_3s.yaml
# Phase-2 "reclassification mode": load the phase-1 set-B model, freeze everything
# except sem_seg_head.predictor.class_embed, and retrain the class head on the
# sparse single-instrument renders (set A + set B together).
#
# The head is compact: reclass_train has N=16 effective classes (set A ids 1-6,8,9
# + set B ids 11-18), so the class head is wider than phase-1's N=8. WEIGHTS must
# therefore point at an *adapted* checkpoint from tools/adapt_classifier_checkpoint.py,
# which copies the 8 set-B rows into their matching slots and fresh-inits the 8
# set-A rows. All 16 rows train; DN is off so the num_classes-shaped label_enc is
# inert. See requirements_new_feature_reclassification.md.
MODEL:
  # Phase-1 set-B checkpoint re-indexed to the 16-class reclass label space:
  #   ./.venv/bin/python tools/adapt_classifier_checkpoint.py \
  #     --src runs/multi_class_setb_live_pool_real_size_4/model_final.pth --src-legacy-raw
  WEIGHTS: "runs/20260915_multi_class_seta_frozen_plateauLR/model_final.pth"
  SEM_SEG_HEAD:
    NUM_CLASSES: -1   # derived from reclass_train (-> N=16); see class_mapping.py
  MaskDINO:
    NUM_OBJECT_QUERIES: 100
    DN: "no"                         # disable denoising -> label_enc never used
    CLASSIFIER_RETRAIN:
      ENABLED: True                  # freeze all but class_embed; force labels-only loss
    TEST:
      NMS_IOU: 0.5
      HUNGARIAN_EVAL:
        ENABLED: True                # writes inference/instance_matching_confusion*.{csv,png}
DATASETS:
  TRAIN: ("reclass_train",)   # classification set (A+B), rotation angles deg%72 != 0
  TEST: ("reclass_val",)      # same set, held-out angles deg%72 == 0
INPUT:
  DATASET_MAPPER_NAME: "hdf5_coco_instance"
  IMAGE_SIZE: 1024
  # No scale jitter: raw frames are already 1024x1024 (== IMAGE_SIZE), so scale=1.0
  # makes ResizeScale/FixedSizeCrop a lossless no-op - no shrink-then-pad, so no
  # artificial padding region for the downstream photometric augmentations to
  # recolor (compounds with ROTATION_ANGLES being 0/90/180/270 - see config.py).
  MIN_SCALE: 1.0
  MAX_SCALE: 1.0
  # Was 0.0. Copy-paste occlusion (below) reuses this same field to drop instances
  # that lose too much area to a later paste - see COPY_PASTE - but raising it also
  # newly filters reclass_train's own original low-visibility instances, not just
  # paste-occluded ones.
  MIN_VISIBILITY: 0.5
  MIN_SIZE_TEST: 1024
  MAX_SIZE_TEST: 1024
  # Combines several sparse single-instrument renders into one busier composite
  # (MBOI, Badilla-Solorzano et al. 2022) with randomized paste-edge blending
  # (Cut, Paste and Learn, Dwibedi et al., arXiv:1708.01642). See maskdino/config.py
  # and maskdino/data/copy_paste.py.
  COPY_PASTE:
    ENABLED: True
    MIN_INSTANCES: 0
    MAX_INSTANCES: 10
SOLVER:
  IMS_PER_BATCH: 6
  BASE_LR: 0.0005        # a single linear head tolerates a higher LR than the full model
  LR_SCHEDULER_NAME: "WarmupCosineRestartsLR"   # SGDR: one warm restart, not a single decay
  BASE_LR_END: 0.000005                 # cosine floor of every cycle = 1% of BASE_LR
  MAX_ITER: 1000         # ~150 train imgs -> ~40 epochs; retune from the eval curve
  WARMUP_ITERS: 50
  WARMUP_FACTOR: 0.001                  # real linear ramp; Base-COCO inherits 1.0 (= no ramp)
  CHECKPOINT_PERIOD: 1000   # /home quota is tight - keep few ~500MB checkpoints
  COSINE_RESTARTS:
    T_0: 400        # cycle 0 = [0,400) full decay to the floor; cycle 1 = [400,1200) cut off
    T_MULT: 2.0     # at MAX_ITER=1000 (75% through) - one restart, not the ~5-cycle pattern
    RESTART_WARMUP_FACTOR: 0.3      # restart ramps from 30% of BASE_LR instead of snapping to it
    RESTART_WARMUP_FRACTION: 0.05   # over the first 5% of the restart cycle (400*0.05=20 iters)
TEST:
  EVAL_PERIOD: 200
OUTPUT_DIR: "runs/reclassify_4-1"
DATALOADER:
  NUM_WORKERS: 4
  FILTER_EMPTY_ANNOTATIONS: True
