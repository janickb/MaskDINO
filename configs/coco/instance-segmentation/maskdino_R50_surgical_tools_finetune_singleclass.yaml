_BASE_: maskdino_R50_bs16_50ep_3s.yaml
MODEL:
  WEIGHTS: "models/maskdino_r50_50ep_300q_hid1024_3sd1_instance_maskenhanced_mask46.1ap_box51.5ap.pth"
  SEM_SEG_HEAD:
     # Must cover the max category_id in the data + 1: the hdf5 loader uses
    # category_id directly as the class index
    NUM_CLASSES: 1
  MaskDINO:
    NUM_OBJECT_QUERIES: 100
    TEST:
      HUNGARIAN_EVAL:
        ENABLED: True
DATASETS:
  TRAIN: ("train_seta",)
  TEST: ("val_seta",)
INPUT:
  DATASET_MAPPER_NAME: "hdf5_coco_instance"
  IMAGE_SIZE: 1024
  MIN_SCALE: 0.8
  MAX_SCALE: 1.2
  MIN_VISIBILITY: 0.0

# NOTE: this SOLVER schedule is sized for a short local try-out only (~1597
# train images, single 8GB GPU) to confirm the pipeline runs end-to-end on the
# real dataset. Re-size it (larger IMS_PER_BATCH across GPUs, LR, MAX_ITER)
# before running a real training job on the multi-GPU cluster.
SOLVER:

  IMS_PER_BATCH: 6
  BASE_LR: 0.0003
  LR_SCHEDULER_NAME: "ReduceLROnPlateau"   # adaptive, metric-driven decay - not a fixed schedule
  MAX_ITER: 50000
  CHECKPOINT_PERIOD: 5000
  WARMUP_ITERS: 250
  WARMUP_FACTOR: 0.001     # added for carrying optimizer state
  PLATEAU:
    METRIC: "total_loss"     # training loss, not validation_loss: it is written every step
    MODE: "min"
    FACTOR: 0.5              # halve LR on each plateau, rather than PyTorch's default 10x cut
    PATIENCE: 5              # checks (not iters) with no improvement before cutting
    CHECK_PERIOD: 300
    MIN_LR: 0.000002         # same floor the cosine version used, for comparability
    THRESHOLD: 1e-2
TEST:
  EVAL_PERIOD: 5000
OUTPUT_DIR: "runs/single_class_v2_frozen_backbone"

